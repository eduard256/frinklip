<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>frinklip icon — preview sheet</title>
<style>
  body { margin: 0; padding: 32px; background: #1d1815; color: #f5efe6;
         font-family: ui-sans-serif, system-ui, sans-serif; }
  h1 { font-weight: 400; font-size: 22px; margin: 0 0 24px; letter-spacing: 0.04em; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end;
         padding: 24px; border-radius: 18px; }
  .row + h2 { margin-top: 32px; font-weight: 400; font-size: 14px;
              letter-spacing: 0.16em; text-transform: uppercase;
              color: #c8b89a; margin-bottom: 0; }
  .light { background: #f5efe6; }
  .dark  { background: #1d1815; outline: 1px solid #3a2e25; }
  .gradient { background: linear-gradient(135deg, #2c1f15 0%, #5a3622 100%); }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 8px; font-size: 11px; color: #c8b89a;
               font-family: ui-monospace, monospace; }
  .light figcaption { color: #5a3c1e; }
  img { display: block; image-rendering: -webkit-optimize-contrast; }
  .small img { box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
  .source { display: block; margin-top: 24px; }
</style>
</head>
<body>
  <h1>frinklip — icon preview sheet</h1>

  <h2>on warm cream</h2>
  <div class="row light small">
    <figure><img src="icons/icon-16.png"  alt="16"/><figcaption>16</figcaption></figure>
    <figure><img src="icons/icon-32.png"  alt="32"/><figcaption>32</figcaption></figure>
    <figure><img src="icons/icon-48.png"  alt="48"/><figcaption>48</figcaption></figure>
    <figure><img src="icons/icon-64.png"  alt="64"/><figcaption>64</figcaption></figure>
    <figure><img src="icons/icon-128.png" alt="128"/><figcaption>128</figcaption></figure>
    <figure><img src="icons/icon-180.png" alt="180"/><figcaption>180</figcaption></figure>
    <figure><img src="icons/icon-192.png" alt="192"/><figcaption>192</figcaption></figure>
    <figure><img src="icons/icon-256.png" alt="256"/><figcaption>256</figcaption></figure>
  </div>

  <h2>on dark</h2>
  <div class="row dark small">
    <figure><img src="icons/icon-16.png"  alt="16"/><figcaption>16</figcaption></figure>
    <figure><img src="icons/icon-32.png"  alt="32"/><figcaption>32</figcaption></figure>
    <figure><img src="icons/icon-48.png"  alt="48"/><figcaption>48</figcaption></figure>
    <figure><img src="icons/icon-64.png"  alt="64"/><figcaption>64</figcaption></figure>
    <figure><img src="icons/icon-128.png" alt="128"/><figcaption>128</figcaption></figure>
    <figure><img src="icons/icon-180.png" alt="180"/><figcaption>180</figcaption></figure>
    <figure><img src="icons/icon-192.png" alt="192"/><figcaption>192</figcaption></figure>
    <figure><img src="icons/icon-256.png" alt="256"/><figcaption>256</figcaption></figure>
  </div>

  <h2>large — 512 / 1024</h2>
  <div class="row gradient">
    <figure><img src="icons/icon-512.png" alt="512" width="256"/><figcaption>512 (shown @256)</figcaption></figure>
    <figure><img src="icons/icon-1024.png" alt="1024" width="384"/><figcaption>1024 (shown @384)</figcaption></figure>
  </div>

  <h2>source SVG (no rounding) for reference</h2>
  <div class="row light">
    <figure><img src="icon.svg" alt="svg" width="256" height="256"/><figcaption>icon.svg @256</figcaption></figure>
  </div>

  <p style="margin-top: 32px; font-size: 12px; color: #c8b89a;">
    Squircle radius: <code>22.37%</code> of side · all PNGs are RGBA with
    transparent corners · master rendered at 2048px then downscaled with
    LANCZOS · <code>favicon.ico</code> bundles 16/32/48/64/128/256.
  </p>
</body>
</html>

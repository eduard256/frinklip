<?xml version="1.0" encoding="UTF-8"?>
<!--
  frinklip app icon — 1024×1024 full-bleed.
  Concept: a single sheet of paper falling into the drop-zone (the
  dashed "tray" echoes the home screen). Warm-paper palette taken
  straight from the running UI — keeps the brand vibe consistent.

  Palette (locked to internal/webui/static/index.html :root tokens):
    bg          #f5efe6   warm cream backdrop
    card / fold #efe6d4   paper, slightly lighter than bg
    accent      #c45f3e   terracotta — fold edge, tray, motion ticks
    accent-sft  #e58a6e   salmon — secondary highlight on the fold
    text/lines  #2a221a   for ruled lines on the sheet
    muted       #8a7962   reserved (unused — kept here for future tweaks)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     role="img" aria-label="frinklip — drop a file">

  <!-- ============================================================
       1. Backdrop. Subtle radial warmth so the icon doesn't feel
       like a flat swatch when scaled up to a 1024 app tile.
       ============================================================ -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%"  stop-color="#fbf3e6"/>
      <stop offset="60%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#ecdfc7"/>
    </radialGradient>

    <!-- Paper sheet body: barely-there top-to-bottom shading so the
         page reads as 3D under directional light. -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fbf6ea"/>
      <stop offset="100%" stop-color="#ede2cb"/>
    </linearGradient>

    <!-- The folded corner — terracotta gradient so the triangle
         flips between accent and accent-soft as it catches light. -->
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e58a6e"/>
      <stop offset="100%" stop-color="#c45f3e"/>
    </linearGradient>

    <!-- Soft shadow underneath the falling sheet, to anchor it
         above the dashed tray. -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#5a3c1e" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#5a3c1e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5a3c1e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1024×1024 cream backdrop, full-bleed. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- ============================================================
       2. Dashed "tray" scoop at the bottom — a wide horizontal U
       echoing the drop-zone in the app. Stroke uses the terracotta
       accent so the tray reads as the catch surface. The tray is
       set just below the sheet and clipped by viewBox padding so
       its left/right ends bleed off the icon edges, hinting that
       the tray is bigger than what fits in frame.
       ============================================================ -->
  <path d="M 80 720
           C 80 880, 944 880, 944 720"
        fill="none"
        stroke="#c45f3e"
        stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="2 28"
        opacity="0.85"/>

  <!-- ============================================================
       3. Soft drop-shadow ellipse on the tray, suggesting the
       sheet is *almost* there.
       ============================================================ -->
  <ellipse cx="512" cy="800" rx="250" ry="32" fill="url(#dropShadow)"/>

  <!-- ============================================================
       4. Motion ticks — three short vertical strokes above the
       sheet, decreasing opacity downward. Reads as "falling".
       Spaced asymmetrically so it feels organic, not engineered.
       ============================================================ -->
  <g stroke="#c45f3e" stroke-linecap="round" stroke-width="10">
    <line x1="430" y1="80"  x2="430" y2="150" opacity="0.35"/>
    <line x1="512" y1="58"  x2="512" y2="138" opacity="0.55"/>
    <line x1="600" y1="92"  x2="600" y2="160" opacity="0.30"/>
  </g>

  <!-- ============================================================
       5. The paper sheet itself. Slightly tilted (-7°) around its
       own center for energy. Folded corner top-right — that's the
       brand color highlight.

       Sheet rect:    260,220  -> 760,720    (500 × 500 before fold)
       Center for tilt: (510, 470)
       ============================================================ -->
  <g transform="rotate(-7 510 470)">

    <!-- Body of the sheet, with the folded corner clipped out so
         the back-of-page color shows through cleanly. The corner
         fold is 110px on each side, top-right. -->
    <path d="M 260 220
             L 650 220
             L 760 330
             L 760 720
             L 260 720
             Z"
          fill="url(#paper)"
          stroke="#2a221a"
          stroke-opacity="0.18"
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- The fold triangle. Two paths: the underside (accent
         gradient) and a thin highlight along its hypotenuse
         to suggest a crease. -->
    <path d="M 650 220
             L 760 330
             L 650 330
             Z"
          fill="url(#fold)"/>

    <!-- Crease line — same hypotenuse, slightly inset. Adds a
         subtle ridge that catches light. -->
    <path d="M 654 224 L 756 326"
          stroke="#fbf3e6"
          stroke-opacity="0.55"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Three ruled lines on the sheet. Hand-drawn feel via
         tiny end-caps, not rigid rectangles. The middle one is
         shorter, like a paragraph break, to dodge the "fake
         document" cliché. -->
    <g stroke="#2a221a" stroke-opacity="0.32"
       stroke-width="9" stroke-linecap="round">
      <line x1="320" y1="430" x2="700" y2="430"/>
      <line x1="320" y1="500" x2="560" y2="500"/>
      <line x1="320" y1="570" x2="660" y2="570"/>
    </g>

    <!-- A faint frinklip "f" mark in the bottom-right of the
         sheet — Instrument Serif italic, low opacity. Easter
         egg at full size, invisible at 16px favicon. -->
    <text x="708" y="680"
          font-family="'Instrument Serif', 'Times New Roman', serif"
          font-style="italic"
          font-size="78"
          fill="#c45f3e"
          fill-opacity="0.55"
          text-anchor="end">f</text>
  </g>

  <!-- ============================================================
       6. Squiggle accent — the same hand-drawn underline used
       under "paths" in the hero. Sits between the sheet and the
       tray, signaling that the path is what comes out at the
       bottom. Single Bezier so it stays crisp at any scale.
       ============================================================ -->
  <path d="M 320 770
           C 440 740, 580 800, 720 760"
        fill="none"
        stroke="#c45f3e"
        stroke-width="12"
        stroke-linecap="round"
        opacity="0.9"/>

</svg>
